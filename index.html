//    Kettlebell-Training passt.
//  - Kurs / Beginner-Modul (Stufen "normal" und "schwer"): 12 Einheiten, die
//    ab Einheit 1 auf dem Niveau der gewählten Stufe starten.
// Wählbare Stufen pro Modul: Einsteiger bietet "leicht", "mittel" und "schwer"
// (mehr Wiederholungen bzw. längere Dauer), das Beginner-Modul "normal" und "schwer".

const UNIT_LABELS = {

    reps: " Wdh.",
    reps_side: " pro Seite",

    m: " m",
    m_side: " m pro Seite"
  },
  en: {

    reps_side: " per side",
    sec: " sec",
    sec_side: " sec per side",
    m: " m",
    m_side: " m per side"
  }
};
const SIDE_WORDS = {
  de: {
    left: "links",
    right: "rechts"
  },
  en: {
    left: "left",
    right: "right"
  }
};

// Bei Seiten-Übungen beide Seiten explizit ausschreiben statt nur "pro Seite".
function formatReps(value, unit, lang) {
  if (unit.endsWith("_side")) {
    const baseUnit = UNIT_LABELS[lang][unit.replace("_side", "")];
    const w = SIDE_WORDS[lang];
    return `${value}${baseUnit} ${w.left} · ${value}${baseUnit} ${w.right}`;
  }
  return `${value}${UNIT_LABELS[lang][unit]}`;
}

function slug(name) {
  return name.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "");
}

// Manche Übungen (Halo, Good Morning) tauchen sowohl im Aufwärmen als auch als
// echte Trainingsübung auf.
function interleaveByRegion(names) {
  const lower = names.filter(n => BODY_REGION[n] === "lower");
  const upper = names.filter(n => BODY_REGION[n] === "upper");
  const core = names.filter(n => BODY_REGION[n] === "core");
  const carry = names.filter(n => BODY_REGION[n] === "carry");
  const out = [];
  let i = 0,
    j = 0;
  while (i < lower.length || j < upper.length) {
    if (i < lower.length) out.push(lower[i++]);
    if (j < upper.length) out.push(upper[j++]);
  }
  return out.concat(core, carry);
}
function reorderByRegion(list) {
  if (list.length < 3) return list;
  const isObjects = typeof list[0] !== "string";
  const names = isObjects ? list.map(item => item.name) : list;
  const orderedNames = interleaveByRegion(names);
  if (!isObjects) return orderedNames;
  const byName = new Map();
  list.forEach(item => {
    if (!byName.has(item.name)) byName.set(item.name, []);
    byName.get(item.name).push(item);
  });
  return orderedNames.map(n => byName.get(n).shift());
}

// TIMER-LOGIK
// ============================================================
function playBeep(long) {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.frequency.value = long ? 660 : 880;
    const dur = long ? 0.6 : 0.25;
    gain.gain.setValueAtTime(0.0001, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.3, ctx.currentTime + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + dur);
    osc.start();
    osc.stop(ctx.currentTime + dur);
  } catch (e) {
    // Web Audio nicht verfügbar — Timer läuft trotzdem stumm weiter
  }
}

// Eigenständiger Doppel-Chime (leiser, höherer Ton als playBeep), signalisiert
// z.B. beim Suitcase Carry die Hälfte der Arbeitszeit ("jetzt Seite wechseln"),
// ohne mit dem Übergangs-Beep von playBeep verwechselt zu werden.
function playHalfwayChime() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    [0, 0.16].forEach(offset => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.frequency.value = 520;
      const start = ctx.currentTime + offset;
      gain.gain.setValueAtTime(0.0001, start);
      gain.gain.exponentialRampToValueAtTime(0.22, start + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.13);
      osc.start(start);
      osc.stop(start + 0.14);
    });
  } catch (e) {
    // Web Audio nicht verfügbar — Hinweistext im UI bleibt trotzdem sichtbar
  }

  // eines App-Exits aus, und der Listener schließt die jeweils oberste offene Ebene
  // (Timer zuerst, dann Detail-Ansichten). Schließen per X/Zurück-Button ruft ebenfalls
  // history.back() auf, damit der History-Stack immer zum sichtbaren Zustand passt.

    if (activeTimer) window.history.pushState({
      kbLayer: "timer"

    if (libraryView === "detail") window.history.pushState({
      kbLayer: "libraryDetail"
    }, "");

  const prevProgramView = useRef("modules");
  useEffect(() => {
    if (programView === "detail") window.history.pushState({
      kbLayer: "programDetail"
    }, "");
    // Die Einheitenübersicht ist eine eigene Ebene über der Modulübersicht; beim Zurück aus
    // einer Einheit entsteht kein zweiter Eintrag.
    if (programView === "list" && prevProgramView.current === "modules") window.history.pushState({
      kbLayer: "programList"
    }, "");
    prevProgramView.current = programView;
  }, [programView]);
  useEffect(() => {
    const handlePopState = () => {
      if (activeTimer) {
        setActiveTimer(null);
        return;
      }
      if (libraryView === "detail") {
        setLibraryView("grid");
        if (libraryFromSession) {
          setLibraryFromSession(false);
          setTab("program");
        }
        return;
      }
      if (programView === "detail") {
        setProgramView("list");
        return;
      }
      if (programView === "list") {
        setProgramView("modules");

        // Migration: alte Speicherstände hatten nur ein einzelnes "beginner"-Modul.
        // Ohne die neuen "einsteiger"/"kurs"-Module fangen wir für diesen Nutzer
        // einfach mit einem frischen Modul-Zustand an (kein Fortschritt zu retten).
        if (!parsed.modules || !parsed.modules.einsteiger || !parsed.modules.kurs) {
          merged.modules = emptyState().modules;
          merged.activeModule = "einsteiger";
        } else {

            ...parsed.modules

          // gespeicherte Stand (z. B. Beginner-Modul 12 -> 16), fehlende Einheiten ergänzen.
          // Der Einsteiger-Kurs wurde auf 4 Einheiten verkürzt (neuer Inhalt). Ein
          // alter Stand mit mehr Einheiten passt nicht mehr zu den neuen Einheiten
          // und wird daher zurückgesetzt, sonst würden alte "erledigt"-Haken auf
          // neue Einheiten fallen.
          if (Object.keys(merged.modules.einsteiger.sessions || {}).length > MODULE_TOTAL_SESSIONS.einsteiger) {
            merged.modules.einsteiger = emptyState().modules.einsteiger;
          }
          merged.modules.einsteiger = fillMissingSessions(merged.modules.einsteiger, MODULE_TOTAL_SESSIONS.einsteiger);
          merged.modules.kurs = fillMissingSessions(merged.modules.kurs, MODULE_TOTAL_SESSIONS.kurs);
        }
