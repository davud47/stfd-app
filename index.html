// Zirkel-Verhältnis staffelt sich mit der Stufe (nach Vorbild kettlebellsworkouts.com):
// Leicht mehr Pause als Arbeit, Schwer umgekehrt — nicht mehr fix 40/20 für alle.
const CIRCUIT_RATIO = {
  leicht: { work: 20, rest: 40 },
  normal: { work: 30, rest: 30 },
  schwer: { work: 40, rest: 20 },
};

const UNIT_LABELS = {
  de: { reps: " Wdh.", reps_side: " pro Seite", sec: " Sek.", sec_side: " Sek. pro Seite", m: " m" },
  en: { reps: " reps", reps_side: " per side", sec: " sec", sec_side: " sec per side", m: " m" },
};

const SIDE_WORDS = {
  de: { left: "links", right: "rechts" },
  en: { left: "left", right: "right" },
};

// Bei Seiten-Übungen beide Seiten explizit ausschreiben statt nur "pro Seite".
function formatReps(value, unit, lang) {
  if (unit === "reps_side" || unit === "sec_side") {
    const baseUnit = unit === "reps_side" ? UNIT_LABELS[lang].reps : UNIT_LABELS[lang].sec;
    const w = SIDE_WORDS[lang];
    return `${value}${baseUnit} ${w.left} · ${value}${baseUnit} ${w.right}`;
  }
  return `${value}${UNIT_LABELS[lang][unit]}`;
}

// Single-Kettlebell-Übungspool — nur eine Kettlebell nötig, eigene Videos statt MoveKit.
const CUES = {
  "Kettlebell Goblet Squat": { de: "Kettlebell an den Hörnern vor der Brust halten, Oberkörper bleibt aufrecht. Beansprucht vor allem die vordere Oberschenkelmuskulatur.", en: "Hold the kettlebell by the horns at chest height, torso stays upright. Targets mainly the quadriceps." },
  "Kettlebell Swing": { de: "Hüftstreckung erzeugt den Schwung, kein Anheben mit den Armen — die Kettlebell schwebt nur bis Brusthöhe, nicht höher. Die definierende Kettlebell-Übung — explosive Hüftstreckung für Gesäß und hintere Oberschenkel.", en: "Hip extension powers the swing, don't lift with your arms — the kettlebell floats only up to chest height, not higher. The defining kettlebell movement — an explosive hip hinge for glutes and hamstrings." },
  "Kettlebell Sumo Deadlift": { de: "Breiter Stand, Zehen leicht nach außen, Oberkörper bleibt aufrecht. Beansprucht vor allem die Gesäßmuskulatur.", en: "Wide stance, toes turned slightly out, torso stays upright. Targets mainly the glutes." },
  "Kettlebell Romanian Deadlift": { de: "Leichte Kniebeugung, Hüfte weit nach hinten schieben, langsame kontrollierte Dehnung. Beansprucht Gesäß und hintere Oberschenkelmuskulatur.", en: "Slight knee bend, push the hips far back for a slow, controlled stretch. Targets the glutes and hamstrings." },
  "Kettlebell Hip Thrust": { de: "Schultern auf einer stabilen Erhöhung, Hüfte explosiv nach oben drücken. Isoliert gezielt die Gesäßmuskulatur.", en: "Shoulders on a stable elevated surface, drive the hips up explosively. Isolates the glutes directly." },
  "Kettlebell Single Arm Row": { de: "Rücken flach, Ellbogen eng am Körper führen. Isoliert Rücken und Bizeps mit vollem Bewegungsradius.", en: "Flat back, keep the elbow close to your body. Isolates the back and biceps through a full range of motion." },
  "Kettlebell Push Press": { de: "Kurzer Beinschwung gibt den Impuls, dann Arm strecken. Beansprucht Schulter und Trizeps.", en: "A short leg dip creates the drive, then the arm finishes the press. Targets the shoulder and triceps." },
  "Kettlebell One-Arm Press": { de: "Kettlebell in Schulterhöhe, eine Seite nach der anderen ohne Schwung nach oben drücken. Isoliert Schulter und Trizeps einseitig.", en: "Kettlebell at shoulder height, press straight up one side at a time without momentum. Isolates the shoulder and triceps on one side." },
  "Kettlebell Floor Press": { de: "Rückenlage, Ellbogen auf dem Boden abgestützt, Kettlebell von dort nach oben drücken. Schonende, liegende Alternative zum klassischen Bankdrücken.", en: "Lying on your back, elbow supported on the floor, press the kettlebell up from there. A shoulder-friendly, floor-based alternative to the bench press." },
  "Kettlebell Suitcase Carry": { de: "Kettlebell seitlich am Körper tragen wie einen Koffer, Rumpf bleibt gerade, nicht zur Seite neigen. Trainiert seitliche Rumpfstabilität.", en: "Carry the kettlebell at your side like a suitcase, torso stays upright, don't lean to either side. Trains lateral core stability." },
  "Kettlebell Curl": { de: "Ellbogen fixiert, sauber curlen ohne Schwung. Direktes Bizepstraining im Stehen.", en: "Elbows fixed, curl cleanly without swinging. Direct standing bicep work." },
  "Kettlebell Goblet Curl": { de: "Beide Hände am Griff, gleichzeitig beidarmig curlen. Beidarmiges Bizepstraining mit nur einer Kettlebell.", en: "Both hands on the handle, curl both arms at once. Two-armed bicep work using a single kettlebell." },
  "Kettlebell Front Raise": { de: "Kontrolliert bis Schulterhöhe heben, kein Schwung aus dem Rücken. Isoliert die vordere Schulter.", en: "Raise with control to shoulder height, no swinging from the back. Isolates the front of the shoulder." },
  "Kettlebell Shrug": { de: "Kontrolliert hochziehen, kurz oben halten, langsam absenken. Isoliert gezielt den oberen Trapezmuskel.", en: "Pull up with control, pause briefly at the top, lower slowly. Isolates the upper traps directly." },
  "Kettlebell Calf Raise": { de: "Langsam auf die Zehenspitzen, kurz halten, kontrolliert absenken. Direktes Wadentraining.", en: "Rise slowly onto your toes, pause briefly, lower with control. Direct calf work." },
  "Kettlebell Alternating Curtsy Lunge": { de: "Bein diagonal nach hinten kreuzen, Knie sanft Richtung Boden. Beansprucht gezielt die seitliche Gesäßmuskulatur und die Bein-Stabilisatoren.", en: "Cross one leg diagonally behind you, knee drifts gently toward the floor. Targets the glute medius and inner-leg stabilizers." },
  "Plank": { de: "Unterarme und Zehenspitzen am Boden, Körper bildet eine gerade Linie von Kopf bis Ferse. Beansprucht die gesamte Rumpfmuskulatur.", en: "Forearms and toes on the floor, body forms a straight line from head to heel. Engages the entire core." },
  "Push-Up": { de: "Hände unter den Schultern, Körper bildet eine gerade Linie. Brust kontrolliert Richtung Boden senken, dann drücken. Beansprucht Brust, Schultern und Trizeps.", en: "Hands under shoulders, body forms a straight line. Lower your chest toward the floor with control, then press back up. Targets chest, shoulders and triceps." },
  "Russian Twist": { de: "Sitzend, Oberkörper leicht zurückgelehnt, Füße angehoben oder am Boden. Oberkörper kontrolliert von Seite zu Seite rotieren. Beansprucht die seitliche Bauchmuskulatur.", en: "Seated, torso leaned back slightly, feet lifted or on the floor. Rotate your torso side to side with control. Targets the obliques." },
  "Kettlebell Clean": { de: "Kettlebell vom Boden in einer fließenden Bewegung bis in die Rack-Position an der Schulter führen, Handgelenk dreht sich mit, kein Anschlagen am Unterarm. Beansprucht Gesäß, Rücken und Unterarme.", en: "Bring the kettlebell from the floor to the rack position at the shoulder in one flowing motion, the wrist rotates through, no banging against the forearm. Targets the glutes, back and forearms." },
  "Kettlebell Snatch": { de: "Kettlebell aus dem Schwung heraus in einer Bewegung bis zur vollständig gestreckten Überkopf-Position bringen, Handgelenk dreht sich sauber um die Kettlebell herum. Eine der anspruchsvollsten Kettlebell-Bewegungen, volle Aufmerksamkeit auf Technik.", en: "Drive the kettlebell from the swing in one motion to a fully locked-out overhead position, the wrist rotates cleanly around the bell. One of the most demanding kettlebell movements — full attention on technique." },
  "Kettlebell Single Arm Swing": { de: "Wie der beidarmige Swing, nur mit einer Hand — Hüftstreckung erzeugt den Schwung, freier Arm hilft leicht beim Gleichgewicht. Fordert Rumpf und Griffkraft stärker als beidarmig.", en: "Same as the two-hand swing, but with one arm — hip extension powers the swing, the free arm helps lightly with balance. Challenges the core and grip more than the two-hand version." },
  "Kettlebell Sumo High Pull": { de: "Aus der breiten Sumo-Haltung die Kettlebell mit Schwung bis auf Schlüsselbeinhöhe ziehen, Ellbogen hoch und außen. Zügige, dynamische Bewegung.", en: "From the wide sumo stance, pull the kettlebell up to collarbone height with momentum, elbow high and out to the side. A quick, dynamic movement." },
  "Kettlebell Racked Reverse Lunge": { de: "Kettlebell in der Rack-Position an der Schulter halten, ein Bein großen Schritt nach hinten, hinteres Knie sinkt Richtung Boden. Beansprucht Gesäß und vordere Oberschenkelmuskulatur einseitig.", en: "Hold the kettlebell in the rack position at the shoulder, step one leg far back, back knee lowers toward the floor. Targets the glutes and quads on one side." },
  "Kettlebell Suitcase Row": { de: "Kettlebell seitlich am Körper wie einen Koffer halten, aus dieser Position zur Hüfte hochziehen. Isoliert Rücken und Bizeps ohne Rotation im Rumpf.", en: "Hold the kettlebell at the side like a suitcase, pull it up to the hip from this position. Isolates the back and biceps without rotating the torso." },
  "Kettlebell Halo": { de: "Kettlebell an den Hörnern nah am Kopf vorbei kreisen lassen, Rumpf bleibt stabil, keine Ausweichbewegung. Als Trainingsübung mit mehr Wiederholungen: kräftigt gezielt die Schulterstabilität.", en: "Circle the kettlebell by the horns closely around the head, core stays stable, no compensating movement. As a training exercise with more reps: builds shoulder stability directly." },
  "Kettlebell Good Morning": { de: "Kettlebell im Nacken oder vor der Brust halten, Hüfte nach hinten schieben, leichte Kniebeugung, Rücken bleibt gerade. Als Trainingsübung mit mehr Wiederholungen: kräftigt gezielt die hintere Kette.", en: "Hold the kettlebell behind the neck or at the chest, push the hips back, slight knee bend, back stays straight. As a training exercise with more reps: builds the posterior chain directly." },
  "Kettlebell Deck Squat": { de: "Aus dem Sitzen auf dem Boden mit Schwung und Hüftmobilität zurück in den Stand kommen, Kettlebell vor der Brust. Fortgeschrittene Übung, braucht gute Hüftbeweglichkeit.", en: "From sitting on the floor, use momentum and hip mobility to come back up to standing, kettlebell held at the chest. An advanced movement that needs good hip mobility." },
  "Kettlebell Pistol Squat": { de: "Einbeinige Kniebeuge, Kettlebell vor der Brust als Gegengewicht. Sehr anspruchsvoll für Kraft, Balance und Beweglichkeit — freies Bein bleibt während der ganzen Bewegung angehoben.", en: "Single-leg squat, kettlebell held at the chest as a counterbalance. Very demanding for strength, balance and mobility — the free leg stays raised throughout the movement." },
  "Kettlebell Single-Leg Deadlift": { de: "Auf einem Bein stehend, Kettlebell in der gegenüberliegenden Hand, Oberkörper nach vorne kippen während das freie Bein nach hinten streckt. Trainiert Balance und die hintere Kette einseitig.", en: "Standing on one leg, kettlebell in the opposite hand, tip the torso forward as the free leg extends back. Trains balance and the posterior chain on one side." },
  "Kettlebell Bottoms-Up Press": { de: "Kettlebell verkehrt herum halten (Kugel nach oben), dann über den Kopf drücken. Verlangt extreme Griff- und Rumpfspannung, um die Kettlebell stabil zu halten — deutlich leichteres Gewicht als beim normalen Press nötig.", en: "Hold the kettlebell upside down (bell facing up), then press it overhead. Demands extreme grip and core tension to keep it stable — needs noticeably less weight than a normal press." },
  "Kettlebell Slingshot": { de: "Kettlebell locker um den Körper herum von einer Hand zur anderen kreisen lassen, Rumpf bleibt stabil und aufrecht. Gewöhnt Körper und Griff an die Kettlebell, gute erste Übung zum Kennenlernen des Geräts.", en: "Loosely circle the kettlebell around your body from hand to hand, core stays stable and upright. Gets your body and grip used to the kettlebell — a good first exercise for getting to know the tool." },
  "Kettlebell Single Arm Deadlift": { de: "Kettlebell mittig zwischen den Füßen, Hüfte nach hinten schieben, mit einer Hand greifen und über die Hüftstreckung aufstehen, nicht mit dem Arm ziehen. Einarmige Grundversion des Kreuzhebens, guter Einstieg ins Hüft-Hinge-Muster.", en: "Kettlebell centered between your feet, push the hips back, grip with one hand and stand up by extending the hips, not pulling with the arm. A single-arm base version of the deadlift, a good entry into the hip-hinge pattern." },
  "Kettlebell Thruster": { de: "Fließende Bewegung von der Kniebeuge direkt in die Überkopf-Streckung, einarmig. Beansprucht Gesäß und Schultern in einer Bewegung.", en: "One flowing motion from the squat straight into the overhead lockout, single-arm. Targets the glutes and shoulders in one movement." },
  "Kettlebell Clean and Press": { de: "Kettlebell vom Boden in die Rack-Position cleanen, direkt im Anschluss über den Kopf drücken. Verbindet zwei Grundbewegungen zu einer fließenden Einheit.", en: "Clean the kettlebell from the floor to the rack position, then press it overhead right after. Combines two fundamental movements into one flowing sequence." },
  "Kettlebell Squat and Press": { de: "Kniebeuge mit der Kettlebell in Rack-Position, direkt im Anschluss aus dem Aufstehen heraus über den Kopf drücken. Ganzkörper-Kombination.", en: "Squat while holding the kettlebell in the rack position, then press it overhead as you stand up. A full-body combination." },
  "Kettlebell Lunge and Press": { de: "Ausfallschritt mit der Kettlebell in Rack-Position, beim Zurückkommen in den Stand die Kettlebell über den Kopf drücken. Fordert Balance und Kraft gleichzeitig.", en: "Lunge while holding the kettlebell in the rack position, press it overhead as you return to standing. Demands balance and strength at once." },
  "Kettlebell Static Lunge and Press": { de: "Wie Lunge and Press, aber die Füße bleiben während der ganzen Übung an derselben Stelle stehen. Belastet eine Körperseite gezielt mehrfach hintereinander.", en: "Like the lunge and press, but the feet stay planted in the same spot throughout. Loads one side of the body repeatedly in a row." },
  "Kettlebell Clean, Squat and Press": { de: "Kettlebell cleanen, aus der Rack-Position in die Kniebeuge gehen, danach über den Kopf drücken. Anspruchsvolle Dreifach-Kombination, braucht geübte Technik in allen drei Teilbewegungen.", en: "Clean the kettlebell, squat from the rack position, then press it overhead. A demanding three-part combination that needs solid technique in all three phases." },
  "Kettlebell Clean and Push Press": { de: "Kettlebell cleanen, dann mit kurzem Beinschwung statt reiner Armkraft über den Kopf drücken. Erlaubt etwas mehr Gewicht als die reine Press-Variante.", en: "Clean the kettlebell, then use a short leg dip instead of pure arm strength to press it overhead. Allows a bit more weight than the strict press version." },
};

function slug(name) {
  return name.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "");
}

// Manche Übungen (Halo, Good Morning) tauchen sowohl im Aufwärmen als auch als
// echte Trainingsübung auf — sie teilen sich denselben Video-Link, damit nicht
// zweimal dieselbe Bewegung gefilmt werden muss.
const VIDEO_KEY_OVERRIDES = {
  "Kettlebell Halo": "warmup-kb-halo",
  "Kettlebell Good Morning": "warmup-kb-good-morning",
};
function videoKey(name) {
  return VIDEO_KEY_OVERRIDES[name] || slug(name);
}

function interleaveByRegion(names) {
  const lower = names.filter((n) => BODY_REGION[n] === "lower");
  const upper = names.filter((n) => BODY_REGION[n] === "upper");
  const core = names.filter((n) => BODY_REGION[n] === "core");
  const carry = names.filter((n) => BODY_REGION[n] === "carry");
  const out = [];
  let i = 0, j = 0;
  while (i < lower.length || j < upper.length) {
    if (i < lower.length) out.push(lower[i++]);
    if (j < upper.length) out.push(upper[j++]);
  }
  return out.concat(core, carry);
}

function reorderByRegion(list) {
  if (list.length < 3) return list;
  const isObjects = typeof list[0] !== "string";
  const names = isObjects ? list.map((item) => item.name) : list;
  const orderedNames = interleaveByRegion(names);
  if (!isObjects) return orderedNames;
  const byName = new Map();
  list.forEach((item) => {
    if (!byName.has(item.name)) byName.set(item.name, []);
    byName.get(item.name).push(item);
  });
  return orderedNames.map((n) => byName.get(n).shift());
}

    note: { de: "Erste EMOM-Einheit — zu Beginn jeder Minute die Wiederholungen absolvieren, der Rest der Minute ist Pause.", en: "First EMOM session — do the reps at the start of each minute, the rest of the minute is rest." },
  },
  finale: {
    note: { de: "Der große Abschluss-Chipper: jede Übung der Bibliothek einmal, keine Wiederholung — unabhängig von der gewählten Stufe.", en: "The big finisher chipper: every exercise in the library once, no repeats — regardless of the selected tier." },
  },
};

function playBeep(long) {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.frequency.value = long ? 660 : 880;
    const dur = long ? 0.6 : 0.25;
    gain.gain.setValueAtTime(0.0001, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.3, ctx.currentTime + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + dur);
    osc.start();
    osc.stop(ctx.currentTime + dur);
  } catch (e) {
    // Web Audio nicht verfügbar — Timer läuft trotzdem stumm weiter
  }
}

function buildEmomSequence(exercises, rounds) {
  const seq = [];
  for (let r = 0; r < rounds; r++) exercises.forEach((ex) => seq.push({ label: ex.name, seconds: 60, type: "work" }));
  return seq;
}
function buildIntervalSequence(exercises, rounds, workSec, restSec, restLabel) {
  const seq = [];
  for (let r = 0; r < rounds; r++) {
    exercises.forEach((ex, i) => {
      seq.push({ label: ex.name, seconds: workSec, type: "work" });
      const isVeryLast = r === rounds - 1 && i === exercises.length - 1;
      if (!isVeryLast) seq.push({ label: restLabel, seconds: restSec, type: "rest" });
    });
  }
  return seq;
}
function buildFinisherSequence(name, minutes) {
  const seq = [];
  for (let m = 0; m < minutes; m++) seq.push({ label: name, seconds: 60, type: "work" });
  return seq;
}

// Liste aller Sätze einer Sätze-Einheit — ohne feste Zeit, die Pause wird jeweils
// manuell gestartet, sobald die Wiederholungen erledigt sind.
function buildSetsSteps(exercises, sets) {
  const steps = [];
  exercises.forEach((ex, exIndex) => {
    for (let s = 1; s <= sets; s++) {
      steps.push({ label: ex.name, reps: ex.reps, setNumber: s, totalSets: sets, exerciseIndex: exIndex + 1, totalExercises: exercises.length });
    }
  });
  return steps;
}

const TIER_ORDER = { leicht: 0, normal: 1, schwer: 2 };

function filterByTier(exercises, tierKey) {
  const level = TIER_ORDER[tierKey] ?? 1;
  return exercises.filter((e) => TIER_ORDER[e.tier || "leicht"] <= level);
}

function getSessionData(module, sessionNum, intensityKey, lang, cycle) {
  const isFirstSession = sessionNum === 1 && (cycle || 1) === 1;
  const intensity = INTENSITY_LEVELS[intensityKey] || INTENSITY_LEVELS.normal;
  const t = UI[lang];
  const SESSIONS = module === "beginner" ? SESSIONS_BEGINNER : SESSIONS_ADVANCED;
  const BLOCK_INFO = module === "beginner" ? BLOCK_INFO_BEGINNER : BLOCK_INFO_ADVANCED;
  const session = SESSIONS[sessionNum];
  const block = BLOCK_INFO[session.block];
  const tieredExercises = filterByTier(session.exercises, intensityKey);

  if (session.format === "sets") {
    const sets = Math.max(2, block.sets() + intensity.setsDelta);
    const restBetween = Math.max(15, block.restBetween() + intensity.restDelta);
    let exercises = tieredExercises.map((e) => {
      const raw = e.b * intensity.repsMult;
      const roundTo = e.r || 1;
      const value = Math.max(roundTo, Math.round(raw / roundTo) * roundTo);
      const homeKey = HOME_NOTE_EXERCISES[e.n];
      return { name: e.n, key: slug(e.n), vkey: videoKey(e.n), cue: CUES[e.n][lang], homeNote: homeKey ? t[homeKey] : null, sideNote: e.u.endsWith("_side") ? t.sideNote : null, isSide: e.u.endsWith("_side"), repsValue: value, unit: e.u, reps: formatReps(value, e.u, lang) };
    });
    let finisher = null;
    if (session.finisher) {
      const f = session.finisher;
      const raw = f.b * intensity.repsMult;
      finisher = { name: f.n, key: slug(f.n) + "-finisher", vkey: videoKey(f.n), cue: CUES[f.n][lang], minutes: f.minutes, reps: formatReps(Math.max(1, Math.round(raw)), f.u, lang) };
    }
    return { session, block: session.block, format: "sets", sets, restLabel: t.restBetween(restBetween), exercises, finisher, isFirstSession };
  }

  if (session.format === "circuit") {
    const names = reorderByRegion(tieredExercises.map((e) => e.n));
    const exercises = names.map((n) => ({ name: n, key: slug(n), vkey: videoKey(n), cue: CUES[n][lang], homeNote: HOME_NOTE_EXERCISES[n] ? t[HOME_NOTE_EXERCISES[n]] : null }));
    const rounds = Math.max(2, 3 + intensity.setsDelta);
    const ratio = CIRCUIT_RATIO[intensityKey] || CIRCUIT_RATIO.normal;
    const totalMinutes = Math.round((rounds * exercises.length * (ratio.work + ratio.rest)) / 60);
    return { session, block: session.block, format: "circuit", rounds, workSec: ratio.work, restSec: ratio.rest, totalMinutes, exercises, isFirstSession };
  }

  if (session.format === "emom") {
    let exercises = tieredExercises.map((e) => {
      const raw = e.b * intensity.repsMult;
      const roundTo = e.r || 1;
      const value = Math.max(roundTo, Math.round(raw / roundTo) * roundTo);
      return { name: e.n, key: slug(e.n), vkey: videoKey(e.n), cue: CUES[e.n][lang], homeNote: HOME_NOTE_EXERCISES[e.n] ? t[HOME_NOTE_EXERCISES[e.n]] : null, sideNote: e.u.endsWith("_side") ? t.sideNote : null, isSide: e.u.endsWith("_side"), repsValue: value, unit: e.u, reps: formatReps(value, e.u, lang) };
    });
    exercises = reorderByRegion(exercises);
    const rounds = Math.max(2, 3 + intensity.setsDelta);
    return { session, block: session.block, format: "emom", rounds, restLabel: t.emomLabel(rounds, exercises.length, rounds * exercises.length), exercises, isFirstSession };
  }

  // Chipper (letzte Einheit): Modul 1 nutzt nur den Einsteiger-Pool, Modul 2 die volle Bibliothek — bewusst tierunabhängig als großes Finale.
  const chipperPool = module === "beginner" ? BEGINNER_POOL : Object.keys(CUES);
  const names = interleaveByRegion(chipperPool);
  const exercises = names.map((n) => ({ name: n, key: slug(n) + "-chipper", vkey: videoKey(n), cue: CUES[n][lang], homeNote: HOME_NOTE_EXERCISES[n] ? t[HOME_NOTE_EXERCISES[n]] : null }));
  return { session, block: session.block, format: "chipper", rounds: 1, workSec: 40, restSec: 20, totalMinutes: exercises.length, exercises, isFirstSession };
}

function getLibraryExercises(lang) {
  return Object.keys(CUES).map((n) => ({
    name: n, key: slug(n), vkey: videoKey(n), cue: CUES[n][lang], region: BODY_REGION[n] || "upper",
    homeNote: HOME_NOTE_EXERCISES[n] ? UI[lang][HOME_NOTE_EXERCISES[n]] : null,
    details: EXERCISE_DETAILS[n] ? {
      steps: EXERCISE_DETAILS[n].steps[lang],
      mistakes: EXERCISE_DETAILS[n].mistakes[lang],
      muscles: EXERCISE_DETAILS[n].muscles[lang],
      benefits: EXERCISE_DETAILS[n].benefits[lang],
    } : null,
  }));
}

}

// Kreisförmiger Fortschritts-Timer (SVG-Ring), nach dem Vorbild des Mockups.
function TimerRing({ remaining, total, color, label, C, size = 240, centerText = null }) {
  const r = (size - 20) / 2;
  const circumference = 2 * Math.PI * r;
  const fraction = total > 0 ? Math.max(0, Math.min(1, remaining / total)) : 0;
  const offset = circumference * (1 - fraction);
  return (
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} style={{ display: "block", margin: "0 auto" }}>
      <circle cx={size / 2} cy={size / 2} r={r} fill="none" stroke={C.panelAlt} strokeWidth={10} />
      <circle
        cx={size / 2} cy={size / 2} r={r} fill="none" stroke={color} strokeWidth={10}
        strokeLinecap="round" strokeDasharray={circumference} strokeDashoffset={offset}
        transform={`rotate(-90 ${size / 2} ${size / 2})`}
        style={{ transition: "stroke-dashoffset 0.3s linear" }}
      />
      <text x="50%" y="46%" textAnchor="middle" dominantBaseline="middle" fill={C.text} fontFamily="'Oswald', sans-serif" fontWeight="600" fontSize={centerText ? "44" : "52"}>
        {centerText !== null ? centerText : remaining}
      </text>
      {label && (
        <text x="50%" y="60%" textAnchor="middle" dominantBaseline="middle" fill={color} fontFamily="Inter, system-ui, sans-serif" fontWeight="600" fontSize="12" letterSpacing="0.08em">
          {label}
        </text>
      )}
    </svg>
  );
}

function TimerOverlay({ title, sequence, onClose, t, theme }) {
  const C = THEMES[theme];
  const [segIndex, setSegIndex] = useState(0);
  const [remaining, setRemaining] = useState(sequence[0]?.seconds || 0);
  const [running, setRunning] = useState(true);
  const [done, setDone] = useState(false);

  useEffect(() => {
    if (!running || done) return;
    const id = setInterval(() => {
      setRemaining((r) => {
        if (r <= 1) {
          const nextIndex = segIndex + 1;
          if (nextIndex < sequence.length) {
            playBeep(false);
            setSegIndex(nextIndex);
            return sequence[nextIndex].seconds;
          } else {
            playBeep(true);
            setDone(true);
            setRunning(false);
            return 0;
          }
        }
        return r - 1;
      });
    }, 1000);
    return () => clearInterval(id);
  }, [running, done, segIndex, sequence]);

  const current = sequence[segIndex];
  const isRest = current?.type === "rest";

  return (
    <div style={{ position: "fixed", inset: 0, background: C.overlayBg, zIndex: 200, display: "flex", alignItems: "center", justifyContent: "center", padding: 24 }}>
      <div style={{ width: "100%", maxWidth: 420, textAlign: "center" }}>
        <div style={{ fontSize: 13, color: C.textMuted, marginBottom: 6 }}>{title}</div>
        {!done ? (
          <>
            <div style={{ fontSize: 12.5, color: isRest ? C.textSecondary : C.brass, marginBottom: 4 }}>
              {t.timerSegment(segIndex + 1, sequence.length)}
            </div>
            <div style={{ fontFamily: "'Oswald', sans-serif", fontWeight: 600, fontSize: 22, color: C.text, marginBottom: 18 }}>
              {isRest ? t.timerRestLabel : current?.label}
            </div>
            <div style={{ marginBottom: 24 }}>
              <TimerRing remaining={remaining} total={current?.seconds || 1} color={isRest ? C.textSecondary : C.brass} label={isRest ? t.timerRestLabel : t.timerWorkLabel} C={C} />
            </div>
            <div style={{ display: "flex", gap: 10, justifyContent: "center" }}>
              <button onClick={() => setRunning((r) => !r)} style={{ borderRadius: 14, padding: "12px 28px", background: C.brass, border: "none", color: C.onBrass, fontSize: 15, fontWeight: 600, cursor: "pointer" }}>
                {running ? t.timerPause : t.timerStart}
              </button>
              <button
                onClick={() => { setSegIndex(0); setRemaining(sequence[0].seconds); setDone(false); setRunning(true); }}
                style={{ padding: "12px 20px", background: "transparent", border: `1px solid ${C.borderStrong}`, color: C.text, fontSize: 15, cursor: "pointer" }}
              >
                {t.timerReset}
              </button>
            </div>
          </>
        ) : (
          <div style={{ fontFamily: "'Oswald', sans-serif", fontWeight: 600, fontSize: 28, color: C.brass, marginBottom: 20 }}>{t.timerDone}</div>
        )}
        <button onClick={onClose} style={{ marginTop: 28, background: "transparent", border: "none", color: C.textMuted, fontSize: 13, textDecoration: "underline", cursor: "pointer" }}>
          {t.timerClose}
        </button>
      </div>
    </div>
  );
}

// Für Sätze-Einheiten: zeigt die aktuelle Übung ohne Countdown (Wiederholungen sind
// selbstbestimmt). Erst beim Antippen von "Fertig" startet die Pause automatisch,
// nach Ablauf springt es von selbst zur nächsten Übung/zum nächsten Satz.
function SetsTimer({ title, steps, restSeconds, onClose, t, theme }) {
  const C = THEMES[theme];
  const [stepIndex, setStepIndex] = useState(0);
  const [phase, setPhase] = useState("work"); // "work" | "resting" | "done"
  const [remaining, setRemaining] = useState(restSeconds);
  const [running, setRunning] = useState(true);

  useEffect(() => {
    if (phase !== "resting" || !running) return;
    const id = setInterval(() => {
      setRemaining((r) => {
        if (r <= 1) {
          const next = stepIndex + 1;
          if (next < steps.length) {
            playBeep(false);
            setStepIndex(next);
            setPhase("work");
          } else {
            playBeep(true);
            setPhase("done");
          }
          return restSeconds;
        }
        return r - 1;
      });
    }, 1000);
    return () => clearInterval(id);
  }, [phase, running, stepIndex, steps.length, restSeconds]);

  const current = steps[stepIndex];
  const goToStep = (i) => { if (i < steps.length) { setStepIndex(i); setPhase("work"); setRunning(true); } else setPhase("done"); };

  return (
    <div style={{ position: "fixed", inset: 0, background: C.overlayBg, zIndex: 200, display: "flex", flexDirection: "column", alignItems: "center", padding: "24px 20px", overflowY: "auto" }}>
      <div style={{ width: "100%", maxWidth: 420 }}>

        {/* Kopfzeile */}
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 16 }}>
          <button onClick={onClose} aria-label="close" style={{ width: 40, height: 40, borderRadius: 999, background: C.panel, boxShadow: C.shadow, border: "none", color: C.text, fontSize: 16, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center" }}>✕</button>
          <div style={{ textAlign: "center" }}>
            <div style={{ fontSize: 12, fontWeight: 700, color: C.brass, textTransform: "uppercase", letterSpacing: "0.04em" }}>{title}</div>
            {phase !== "done" && current && (
              <div style={{ fontSize: 12, color: C.textMuted, marginTop: 2 }}>{t.timerSegment(current.exerciseIndex, current.totalExercises)}</div>
            )}
          </div>
          <button aria-label="menu" style={{ width: 40, height: 40, borderRadius: 999, background: C.panel, boxShadow: C.shadow, border: "none", color: C.text, fontSize: 16, cursor: "default", display: "flex", alignItems: "center", justifyContent: "center" }}>⋯</button>
        </div>

        {/* Fortschrittsbalken */}
        <div style={{ height: 4, borderRadius: 999, background: C.panelAlt, overflow: "hidden", marginBottom: 28 }}>
          <div style={{ height: "100%", width: `${(stepIndex / steps.length) * 100}%`, background: C.brass, transition: "width 0.3s" }} />
        </div>

        {phase !== "done" ? (
          <>
            <div style={{ textAlign: "center", marginBottom: 28 }}>
              <div style={{ fontFamily: "'Oswald', sans-serif", fontWeight: 600, fontSize: 28, color: C.text, marginBottom: 6 }}>{current.label}</div>
              <div style={{ fontSize: 14, color: C.textMuted }}>
                {t.timerSetLabel(current.setNumber, current.totalSets)}{current.reps ? ` · ${current.reps}` : ""}
              </div>
            </div>

            <div style={{ display: "flex", justifyContent: "center", marginBottom: 24 }}>
              {phase === "work" ? (
                <TimerRing remaining={1} total={1} color={C.brass} label={t.timerWorkLabel} C={C} centerText="✓" />
              ) : (
                <TimerRing remaining={remaining} total={restSeconds} color={C.brass} label={t.timerRestLabel} C={C} />
              )}
            </div>

            <div style={{ marginBottom: 10 }}>
              <div style={{ fontSize: 11.5, color: C.textMuted, textTransform: "uppercase", letterSpacing: "0.04em", marginBottom: 10, display: "flex", justifyContent: "space-between" }}>
                <span>{t.setProgressLabel}</span>
                <span style={{ fontWeight: 700, color: C.text }}>{current.setNumber} / {current.totalSets}</span>
              </div>
              <div style={{ display: "flex", gap: 6 }}>
                {Array.from({ length: current.totalSets }, (_, i) => i + 1).map((n) => {
                  const done = n < current.setNumber;
                  const isCurrent = n === current.setNumber;
                  return (
                    <div key={n} style={{
                      flex: 1, borderRadius: 12, padding: "10px 0", textAlign: "center", fontSize: 13, fontWeight: 700,
                      background: done || isCurrent ? (isCurrent ? C.text : C.brass) : C.panel,
                      color: isCurrent ? C.bg : done ? C.onBrass : C.textMuted,
                    }}>
                      {done ? "✓" : n}
                    </div>
                  );
                })}
              </div>
            </div>
          </>
        ) : (
          <div style={{ textAlign: "center", padding: "40px 0" }}>
            <div style={{ fontFamily: "'Oswald', sans-serif", fontWeight: 600, fontSize: 28, color: C.brass }}>{t.timerDone}</div>
          </div>
        )}

        {phase !== "done" && (
          <div style={{ display: "flex", gap: 10, marginTop: 24 }}>
            {phase === "work" ? (
              <button
                onClick={() => { setPhase("resting"); setRemaining(restSeconds); setRunning(true); }}
                style={{ borderRadius: 999, flex: 1, padding: "16px 14px", background: C.brass, border: "none", color: C.onBrass, fontSize: 15, fontWeight: 700, cursor: "pointer" }}
              >
                ✓ {t.timerDoneStartRest}
              </button>
            ) : (
              <>
                <button
                  onClick={() => setRunning((r) => !r)}
                  style={{ borderRadius: 999, flex: 1, padding: "16px 14px", background: C.brass, border: "none", color: C.onBrass, fontSize: 15, fontWeight: 700, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", gap: 8 }}
                >
                  {running ? "⏸" : "▶"} {running ? t.timerPause : t.timerStart}
                </button>
                <button
                  onClick={() => goToStep(stepIndex + 1)}
                  aria-label="skip"
                  style={{ borderRadius: 18, width: 54, background: C.panel, boxShadow: C.shadow, border: "none", color: C.text, fontSize: 18, cursor: "pointer" }}
                >
                  ⏭
                </button>
              </>
            )}
          </div>
        )}

        <button onClick={onClose} style={{ display: "block", margin: "20px auto 0", background: "transparent", border: "none", color: C.textMuted, fontSize: 13, textDecoration: "underline", cursor: "pointer" }}>
          {t.timerClose}
        </button>
      </div>
    </div>
  );
}

function KettlebellTracker() {
  const [state, setState] = useState(emptyState());
  const [tab, setTab] = useState("dashboard");
  const [activeSession, setActiveSession] = useState(1);
  const [programView, setProgramView] = useState("list");
  const [libraryView, setLibraryView] = useState("grid");
  const [libraryDetailKey, setLibraryDetailKey] = useState(null);
  const [libraryFilter, setLibraryFilter] = useState("all");
  const [librarySearch, setLibrarySearch] = useState("");
  const [warmupOpen, setWarmupOpen] = useState(false);
  const [cooldownOpen, setCooldownOpen] = useState(false);
  const [expandedExercise, setExpandedExercise] = useState(null);
  const [loading, setLoading] = useState(true);
  const [editingReps, setEditingReps] = useState(null);
  const [repsDraft, setRepsDraft] = useState("");
  const [activeTimer, setActiveTimer] = useState(null);

  // ---------- Auth-State ----------
  const [session, setSession] = useState(null);
  const [profile, setProfile] = useState(null);
  const [authView, setAuthView] = useState("signin"); // "signin" | "signup"
  const [authEmail, setAuthEmail] = useState("");
  const [authPassword, setAuthPassword] = useState("");
  const [authError, setAuthError] = useState(null);
  const [authBusy, setAuthBusy] = useState(false);

  const loadProfile = useCallback(async (userId) => {
    if (!supabaseClient) return;
    const { data } = await supabaseClient.from("profiles").select("*").eq("id", userId).maybeSingle();
    setProfile(data || null);
  }, []);

  useEffect(() => {
    if (!supabaseClient) return;
    supabaseClient.auth.getSession().then(({ data }) => {
      setSession(data.session);
      if (data.session) loadProfile(data.session.user.id);
    });
    const { data: listener } = supabaseClient.auth.onAuthStateChange((_event, newSession) => {
      setSession(newSession);
      if (newSession) loadProfile(newSession.user.id);
      else setProfile(null);
    });
    return () => listener.subscription.unsubscribe();
  }, [loadProfile]);

  const handleSignUp = async () => {
    if (!supabaseClient) return;
    setAuthError(null);
    setAuthBusy(true);
    const { error } = await supabaseClient.auth.signUp({ email: authEmail, password: authPassword });
    setAuthBusy(false);
    if (error) setAuthError(error.message);
    else setAuthError("check_email");
  };

  const handleSignIn = async () => {
    if (!supabaseClient) return;
    setAuthError(null);
    setAuthBusy(true);
    const { error } = await supabaseClient.auth.signInWithPassword({ email: authEmail, password: authPassword });
    setAuthBusy(false);
    if (error) setAuthError(error.message);
  };

  const handleSignOut = async () => {
    if (!supabaseClient) return;
    await supabaseClient.auth.signOut();
  };

  useEffect(() => {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        setState({ ...emptyState(), ...parsed });
      }
    } catch (e) {
    } finally {
      setLoading(false);
    }
  }, []);

  const persist = useCallback((next) => {
    setState(next);
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(next));
    } catch (e) {
      console.error("Speichern fehlgeschlagen", e);
    }
  }, []);

  const toggleCompleted = (sessionNum) => {
    const next = JSON.parse(JSON.stringify(state));
    next.modules[next.activeModule].sessions[sessionNum].completed = !next.modules[next.activeModule].sessions[sessionNum].completed;
    persist(next);
  };

  const saveCustomReps = (sessionNum, exKey) => {
    const next = JSON.parse(JSON.stringify(state));
    const s = next.modules[next.activeModule].sessions[sessionNum];
    if (!s.custom) s.custom = {};
    const val = repsDraft.trim();
    if (val) s.custom[exKey] = val;
    else delete s.custom[exKey];
    persist(next);
    setEditingReps(null);
    setRepsDraft("");
  };

  const clearCustomReps = (sessionNum, exKey) => {
    const next = JSON.parse(JSON.stringify(state));
    const s = next.modules[next.activeModule].sessions[sessionNum];
    if (s.custom) delete s.custom[exKey];
    persist(next);
  };

  const setIntensity = (level) => {
    const next = JSON.parse(JSON.stringify(state));
    next.modules[next.activeModule].intensity = level;
    persist(next);
  };

  const switchModule = (m) => {
    const next = JSON.parse(JSON.stringify(state));
    next.activeModule = m;
    persist(next);
    setActiveSession(1);
    setProgramView("list");
  };

  const startNewCycle = () => {
    const next = JSON.parse(JSON.stringify(state));
    next.modules[next.activeModule].sessions = makeEmptySessions();

    { id: "program", label: t.navProgram, icon: "🏋" },

  const goToSession = (s) => { if (!isSessionLocked(s)) { setActiveSession(s); setProgramView("detail"); } };

  const nextSessionNum = useMemo(() => {
    for (let s = 1; s <= TOTAL_SESSIONS; s++) if (!moduleState.sessions[s].completed) return s;

  const nextSessionData = useMemo(() => getSessionData(activeModule, nextSessionNum, moduleState.intensity, lang, moduleState.cycle), [activeModule, nextSessionNum, moduleState.intensity, moduleState.cycle]);

  const sessionPreviews = useMemo(() => {
    const arr = [];

      arr.push({ num: s, block: d.block, format: d.format, mins });

  }, [activeModule, moduleState.intensity, moduleState.cycle]);

  const filteredLibrary = useMemo(() => {
    return libraryExercises.filter((ex) => {
      if (libraryFilter !== "all" && ex.region !== libraryFilter) return false;
      if (librarySearch.trim() && !ex.name.toLowerCase().includes(librarySearch.trim().toLowerCase())) return false;
      return true;

  const libraryDetailExercise = libraryDetailKey ? libraryExercises.find((ex) => ex.key === libraryDetailKey) : null;

  const FORMAT_ICON = { sets: "🏋", circuit: "🔁", emom: "⏱", chipper: "🏁" };

          <div>
            <div style={{ display: "flex", gap: 8, marginBottom: 16 }}>
              {["beginner", "advanced"].map((m) => {
                const active = activeModule === m;
                return (
                  <button
                    key={m}
                    onClick={() => switchModule(m)}
                    style={{
                      borderRadius: 14, flex: 1, textAlign: "left", padding: "10px 12px",
                      background: active ? C.brass : C.panel, border: `1px solid ${active ? C.brass : C.border}`,

                    <div style={{ fontSize: 13, fontWeight: 600, color: active ? C.onBrass : C.text }}>
                      {m === "beginner" ? t.moduleBeginnerLabel : t.moduleAdvancedLabel}

            <div style={{ display: "flex", gap: 6, marginBottom: 6 }}>

                    {t.intensityLabels[key]}

            <div style={{ fontSize: 12, color: C.textMuted, lineHeight: 1.5, marginBottom: 18 }}>{t.intensityNote}</div>

            <div style={{ fontSize: 12, color: C.textMuted, textTransform: "uppercase", letterSpacing: "0.04em", marginBottom: 4 }}>{TOTAL_SESSIONS} {t.session.toUpperCase()}S</div>
            <h1 style={{ fontFamily: "'Oswald', sans-serif", fontWeight: 600, fontSize: 22, margin: "0 0 12px", color: C.text }}>{t.planHeader}</h1>

            <div style={{ marginBottom: 18 }}>
              <div style={{ display: "flex", justifyContent: "space-between", fontSize: 12, color: C.textSecondary, marginBottom: 6 }}>
                <span>{t.cycleProgress}</span>
                <span>{totalSessionsComplete}/{TOTAL_SESSIONS}</span>
              </div>
              <div style={{ height: 4, borderRadius: 999, background: C.panelAlt, overflow: "hidden" }}>
                <div style={{ height: "100%", width: `${(totalSessionsComplete / TOTAL_SESSIONS) * 100}%`, background: C.brass, transition: "width 0.3s" }} />

            <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>

            )}

            {sessionData.format === "sets" && (
              <div style={{ marginBottom: 16 }}>
                <button
                  onClick={() => setActiveTimer({
                    type: "sets",
                    title: `${t.session} ${String(activeSession).padStart(2, "0")}`,
                    steps: buildSetsSteps(sessionData.exercises, sessionData.sets),
                    restSeconds: Math.max(15, BLOCK_INFO[sessionData.block].restBetween() + (INTENSITY_LEVELS[moduleState.intensity].restDelta)),
                  })}
                  style={{ borderRadius: 999, width: "100%", padding: "16px 14px", background: C.brass, border: "none", color: C.onBrass, fontSize: 15, fontWeight: 700, cursor: "pointer" }}
                >
                  ▶ {t.startSession}
                </button>
              </div>
            )}

            <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
              {sessionData.exercises.map((ex, i) => {
                const isOpen = expandedExercise === ex.key;
                const compactStat = ex.reps
                  ? (sessionData.format === "sets"
                      ? t.setsTimes(sessionData.sets, `${(sessionState.custom && sessionState.custom[ex.key]) || ex.repsValue}${ex.isSide ? ` ${t.perSideShort}` : (UNIT_LABELS[lang][ex.unit] || "")}`)
                      : ex.reps)
                  : null;
                return (
                  <div key={ex.key} style={{ borderRadius: 24, background: C.panel, boxShadow: C.shadow, border: `1px solid ${C.border}`, overflow: "hidden" }}>
                    <button
                      onClick={() => setExpandedExercise(isOpen ? null : ex.key)}
                      style={{ width: "100%", background: "transparent", border: "none", padding: "14px 16px", display: "flex", gap: 12, alignItems: "center", cursor: "pointer", textAlign: "left", color: C.text, font: "inherit" }}
                    >
                      <div style={{ flex: "0 0 auto", width: 26, height: 26, borderRadius: 999, background: C.panelAlt, color: C.textMuted, fontSize: 11.5, fontWeight: 600, display: "flex", alignItems: "center", justifyContent: "center" }}>
                        {String(i + 1).padStart(2, "0")}
                      </div>
                      <div style={{ flex: 1 }}>
                        <div style={{ fontWeight: 500, fontSize: 15, marginBottom: 2 }}>{ex.name}</div>
                        {compactStat && <div style={{ fontSize: 12.5, color: C.textMuted }}>{compactStat}</div>}
                      </div>
                      <div style={{ fontSize: 16, color: C.textMuted }}>{isOpen ? "⌄" : "›"}</div>
                    </button>

                    {isOpen && (
                      <div style={{ padding: "0 16px 16px" }}>
                        {ex.reps && (
                          <div style={{ display: "flex", alignItems: "center", gap: 6, marginBottom: 10, flexWrap: "wrap" }}>
                            {editingReps === ex.key ? (
                              <>
                                <input type="text" value={repsDraft} onChange={(e) => setRepsDraft(e.target.value)} placeholder={t.customPlaceholder} style={{ background: C.bg, border: `1px solid ${C.borderStrong}`, color: C.text, fontSize: 12.5, padding: "4px 8px", width: 110 }} />
                                <button onClick={() => saveCustomReps(activeSession, ex.key)} style={{ background: C.brass, border: "none", color: C.onBrass, fontSize: 12, padding: "4px 10px", cursor: "pointer" }}>{t.save}</button>
                              </>
                            ) : (
                              <>
                                <button onClick={() => { setEditingReps(ex.key); setRepsDraft((sessionState.custom && sessionState.custom[ex.key]) || ex.reps); }} style={{ background: "transparent", border: "none", color: C.textMuted, cursor: "pointer", fontSize: 12, padding: 0 }}>✎ {t.customBadge}</button>
                                {sessionState.custom && sessionState.custom[ex.key] && <button onClick={() => clearCustomReps(activeSession, ex.key)} style={{ background: "transparent", border: "none", color: C.textMuted, cursor: "pointer", fontSize: 11, textDecoration: "underline", padding: 0 }}>{t.customReset}</button>}
                              </>
                            )}
                          </div>
                        )}

                        {ex.isSide && (
                          <div style={{ display: "flex", gap: 8, marginBottom: 10 }}>
                            <div style={{ flex: 1, borderRadius: 14, background: C.panelAlt, padding: "8px 10px" }}>
                              <div style={{ fontSize: 10.5, color: C.textMuted, textTransform: "uppercase", letterSpacing: "0.03em" }}>{t.sideLeftLabel}</div>
                              <div style={{ fontSize: 14, fontWeight: 600, color: C.text }}>{(sessionState.custom && sessionState.custom[ex.key]) || `${ex.repsValue}${UNIT_LABELS[lang][ex.unit.replace("_side", "")]}`}</div>
                            </div>
                            <div style={{ flex: 1, borderRadius: 14, background: C.panelAlt, padding: "8px 10px" }}>
                              <div style={{ fontSize: 10.5, color: C.textMuted, textTransform: "uppercase", letterSpacing: "0.03em" }}>{t.sideRightLabel}</div>
                              <div style={{ fontSize: 14, fontWeight: 600, color: C.text }}>{(sessionState.custom && sessionState.custom[ex.key]) || `${ex.repsValue}${UNIT_LABELS[lang][ex.unit.replace("_side", "")]}`}</div>
                            </div>
                          </div>
                        )}

                        <div style={{ fontSize: 13, color: C.textSecondary, lineHeight: 1.5 }}>{ex.cue}</div>
                        {ex.sideNote && <div style={{ fontSize: 12, color: C.brass, marginTop: 8 }}>↔ {ex.sideNote}</div>}
                        {ex.homeNote && <div style={{ fontSize: 12, color: C.textMuted, marginTop: 4, fontStyle: "italic" }}>{ex.homeNote}</div>}
                      </div>
                    )}
                  </div>
                );
              })}
            </div>

            {sessionData.finisher && (
              <div style={{ marginTop: 18 }}>
                <div style={{ fontSize: 13, color: C.textSecondary, marginBottom: 10 }}>{t.finisherTitle}</div>
                <div style={{ borderRadius: 24, background: C.panel, boxShadow: C.shadow, border: `1px solid ${C.border}`, borderLeft: `3px solid ${C.brass}`, padding: "14px 16px" }}>
                  <div style={{ display: "flex", justifyContent: "space-between", gap: 10 }}>
                    <div style={{ flex: 1 }}>
                      <div style={{ fontWeight: 500, fontSize: 15, marginBottom: 2 }}>{sessionData.finisher.name}</div>
                      <div style={{ fontSize: 12.5, color: C.brass, marginBottom: 2 }}>{t.finisherIntro(sessionData.finisher.minutes)}</div>
                      <div style={{ fontSize: 12.5, color: C.brass, marginBottom: 6 }}>{sessionData.finisher.reps}</div>
                      <div style={{ fontSize: 13, color: C.textSecondary, lineHeight: 1.5 }}>{sessionData.finisher.cue}</div>
                    </div>
                  </div>
                  <button onClick={() => setActiveTimer({ title: t.finisherTimerBtn, sequence: buildFinisherSequence(sessionData.finisher.name, sessionData.finisher.minutes) })} style={{ borderRadius: 14, width: "100%", marginTop: 10, padding: "9px 14px", background: C.brass, border: "none", color: C.onBrass, fontSize: 13, fontWeight: 600, cursor: "pointer" }}>
                    ⏱ {t.finisherTimerBtn}
                  </button>
                </div>
              </div>
            )}

            <div style={{ borderRadius: 24, marginTop: 18, display: "flex", alignItems: "center", justifyContent: "space-between", background: C.panelAlt, border: `1px solid ${C.border}`, padding: "12px 16px" }}>
              <div style={{ fontSize: 13, color: C.textSecondary }}>{t.session} {activeSession} {sessionState.completed ? "✓" : ""}</div>
              <button onClick={() => toggleCompleted(activeSession)} style={{ padding: "8px 16px", background: sessionState.completed ? C.success : C.brass, border: "none", color: sessionState.completed ? C.onSuccess : C.onBrass, fontSize: 13, fontWeight: 600, cursor: "pointer" }}>
                {sessionState.completed ? "✓" : "○"}
              </button>
            </div>

            <div style={{ marginTop: 18 }}>
              <button onClick={() => setCooldownOpen((o) => !o)} style={{ width: "100%", display: "flex", alignItems: "center", justifyContent: "space-between", background: "transparent", border: "none", padding: "4px 0", cursor: "pointer" }}>
                <span style={{ fontWeight: 500, fontSize: 14, color: C.brass }}>{t.cooldownTitle}</span>
                <span style={{ fontSize: 13, color: C.textMuted }}>{cooldownOpen ? "▲" : "▼"}</span>
              </button>
              {cooldownOpen && (
                <div style={{ display: "flex", flexDirection: "column", gap: 8, marginTop: 8 }}>
                  {COOLDOWN.map((c) => (
                    <div key={c.id} style={{ borderRadius: 24, background: C.panel, boxShadow: C.shadow, border: `1px solid ${C.border}`, padding: "10px 12px" }}>
                      <div style={{ fontSize: 13, fontWeight: 500, color: C.text, marginBottom: 2 }}>{c.n[lang]}</div>
                      <div style={{ fontSize: 12.5, color: C.textSecondary, lineHeight: 1.5 }}>{c.d[lang]}</div>
                    </div>
                  ))}
                </div>
              )}
            </div>
          </div>
        )}

        {/* ---------- BIBLIOTHEK — Raster ---------- */}
        {tab === "library" && libraryView === "grid" && (
          <div>
            <div style={{ fontSize: 12, color: C.textMuted, textTransform: "uppercase", letterSpacing: "0.04em", marginBottom: 4 }}>{libraryExercises.length} {t.navLibrary.toUpperCase()}</div>
            <h1 style={{ fontFamily: "'Oswald', sans-serif", fontWeight: 600, fontSize: 22, margin: "0 0 14px", color: C.text }}>{t.libraryHeader}</h1>

            <input
              type="text"
              value={librarySearch}
              onChange={(e) => setLibrarySearch(e.target.value)}
              placeholder={t.searchPlaceholder}
              style={{ borderRadius: 14, width: "100%", background: C.panel, boxShadow: C.shadow, border: `1px solid ${C.border}`, color: C.text, fontSize: 14, padding: "11px 14px", marginBottom: 12 }}
            />

            <div style={{ display: "flex", gap: 6, marginBottom: 16, flexWrap: "wrap" }}>
              {[["all", t.filterAll], ["lower", t.filterLower], ["upper", t.filterUpper], ["core", t.filterCore], ["carry", t.filterCarry]].map(([key, label]) => {
                const active = libraryFilter === key;
                return (
                  <button key={key} onClick={() => setLibraryFilter(key)} style={{ borderRadius: 999, padding: "7px 14px", background: active ? C.brass : C.panel, color: active ? C.onBrass : C.textSecondary, border: `1px solid ${active ? C.brass : C.border}`, fontSize: 12.5, fontWeight: 500, cursor: "pointer" }}>
                    {label}
                  </button>
                );
              })}
            </div>

            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
              {filteredLibrary.map((ex) => (
                <button
                  key={ex.key}
                  className="kb-card"
                  onClick={() => { setLibraryDetailKey(ex.key); setLibraryView("detail"); }}
                  style={{ borderRadius: 24, textAlign: "left", background: C.panel, boxShadow: C.shadow, border: `1px solid ${C.border}`, padding: 0, cursor: "pointer", overflow: "hidden" }}
                >
                  <div style={{ height: 90, background: C.panelAlt, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 26 }}>
                    {REGION_ICON[ex.region] || "🏋"}
                  </div>
                  <div style={{ padding: "10px 12px" }}>
                    <div style={{ fontWeight: 500, fontSize: 13.5, color: C.text, marginBottom: 2 }}>{ex.name.replace(/^Kettlebell /, "")}</div>
                    <div style={{ fontSize: 11, color: C.textMuted }}>
                      {ex.region === "lower" ? t.filterLower : ex.region === "upper" ? t.filterUpper : ex.region === "core" ? t.filterCore : t.filterCarry}
                    </div>
                  </div>
                </button>
              ))}
            </div>
          </div>
        )}

        {/* ---------- BIBLIOTHEK — Detail ---------- */}
        {tab === "library" && libraryView === "detail" && libraryDetailExercise && (
          <div>
            <button onClick={() => setLibraryView("grid")} style={{ background: "transparent", border: "none", color: C.textSecondary, fontSize: 13, cursor: "pointer", padding: 0, marginBottom: 16, display: "flex", alignItems: "center", gap: 6 }}>
              ← {t.backToLibrary}
            </button>

            <div style={{ fontSize: 12, color: C.brass, textTransform: "uppercase", letterSpacing: "0.04em", marginBottom: 6 }}>
              {libraryDetailExercise.region === "lower" ? t.filterLower : libraryDetailExercise.region === "upper" ? t.filterUpper : libraryDetailExercise.region === "core" ? t.filterCore : t.filterCarry}
            </div>
            <h1 style={{ fontFamily: "'Oswald', sans-serif", fontWeight: 600, fontSize: 24, margin: "0 0 16px" }}>{libraryDetailExercise.name}</h1>

            <div style={{ borderRadius: 24, height: 160, background: C.panel, boxShadow: C.shadow, border: `1px solid ${C.border}`, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 44, marginBottom: 16 }}>
              {REGION_ICON[libraryDetailExercise.region] || "🏋"}
            </div>

            <div style={{ borderRadius: 24, background: C.panel, boxShadow: C.shadow, border: `1px solid ${C.border}`, padding: "16px 18px", marginBottom: 16 }}>
              <div style={{ fontSize: 14, color: C.textSecondary, lineHeight: 1.7 }}>{libraryDetailExercise.cue}</div>
              {libraryDetailExercise.homeNote && (
                <div style={{ fontSize: 12.5, color: C.textMuted, marginTop: 10, fontStyle: "italic" }}>{libraryDetailExercise.homeNote}</div>
              )}
            </div>

            {libraryDetailExercise.details && (
              <>
                <div style={{ borderRadius: 24, background: C.panel, boxShadow: C.shadow, border: `1px solid ${C.border}`, padding: "16px 18px", marginBottom: 16 }}>
                  <div style={{ fontWeight: 600, fontSize: 14, color: C.brass, marginBottom: 10 }}>{t.detailStepsTitle}</div>
                  <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
                    {libraryDetailExercise.details.steps.map((s, i) => (
                      <div key={i} style={{ display: "flex", gap: 10 }}>
                        <div style={{ flex: "0 0 auto", width: 22, height: 22, borderRadius: 999, background: C.panelAlt, color: C.brass, fontSize: 11, fontWeight: 700, display: "flex", alignItems: "center", justifyContent: "center" }}>{i + 1}</div>
                        <div style={{ fontSize: 13, color: C.textSecondary, lineHeight: 1.5 }}>{s}</div>
                      </div>
                    ))}
                  </div>
                </div>

                <div style={{ borderRadius: 24, background: C.panel, boxShadow: C.shadow, border: `1px solid ${C.border}`, padding: "16px 18px", marginBottom: 16 }}>
                  <div style={{ fontWeight: 600, fontSize: 14, color: C.brass, marginBottom: 10 }}>{t.detailMistakesTitle}</div>
                  <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                    {libraryDetailExercise.details.mistakes.map((m, i) => (
                      <div key={i} style={{ fontSize: 13, color: C.textSecondary, lineHeight: 1.5, display: "flex", gap: 8 }}>
                        <span>⚠</span><span>{m}</span>
                      </div>
                    ))}
                  </div>
                </div>

                <div style={{ display: "flex", gap: 10, marginBottom: 16 }}>
                  <div style={{ flex: 1, borderRadius: 24, background: C.panel, boxShadow: C.shadow, border: `1px solid ${C.border}`, padding: "14px 16px" }}>
                    <div style={{ fontWeight: 600, fontSize: 13, color: C.brass, marginBottom: 8 }}>{t.detailMusclesTitle}</div>
                    <div style={{ fontSize: 12, color: C.textSecondary, lineHeight: 1.6 }}>{libraryDetailExercise.details.muscles.join(" · ")}</div>
                  </div>
                  <div style={{ flex: 1, borderRadius: 24, background: C.panel, boxShadow: C.shadow, border: `1px solid ${C.border}`, padding: "14px 16px" }}>
                    <div style={{ fontWeight: 600, fontSize: 13, color: C.brass, marginBottom: 8 }}>{t.detailBenefitsTitle}</div>
                    <div style={{ fontSize: 12, color: C.textSecondary, lineHeight: 1.6 }}>{libraryDetailExercise.details.benefits.join(" · ")}</div>
                  </div>
                </div>
              </>
            )}
          </div>
        )}

      </div>

      <div style={{ position: "fixed", bottom: 20, left: "50%", transform: "translateX(-50%)", display: "flex", gap: 4, background: C.navBg, backdropFilter: "blur(14px)", WebkitBackdropFilter: "blur(14px)", border: `1px solid ${C.borderStrong}`, borderRadius: 999, padding: 6, boxShadow: C.shadow, zIndex: 100 }}>
        {NAV_ITEMS.map(({ id, label, icon }) => {
          const active = tab === id;
          return (
            <button
              key={id}
              className="kb-navitem"
              onClick={() => {
                setTab(id);
                if (id === "program") setProgramView("list");
                if (id === "library") setLibraryView("grid");
              }}
              style={{ display: "flex", alignItems: "center", gap: 7, padding: active ? "10px 18px" : "10px 14px", borderRadius: 999, background: active ? C.brass : "transparent", color: active ? C.onBrass : C.textSecondary, border: "none", fontSize: 13, fontWeight: 500, cursor: "pointer" }}
            >
              <span style={{ fontSize: 16, lineHeight: 1 }}>{icon}</span>
              {active && <span>{label}</span>}
            </button>
          );
        })}
      </div>

      {activeTimer && activeTimer.type === "sets" && (
        <SetsTimer title={activeTimer.title} steps={activeTimer.steps} restSeconds={activeTimer.restSeconds} onClose={() => setActiveTimer(null)} t={t} theme={theme} />
      )}
      {activeTimer && activeTimer.type !== "sets" && (
        <TimerOverlay title={activeTimer.title} sequence={activeTimer.sequence} onClose={() => setActiveTimer(null)} t={t} theme={theme} />
      )}
    </div>
  );
}


const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<KettlebellTracker />);
</script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("service-worker.js").catch(() => {});
    });
  }
</script>
</body>
</html>
