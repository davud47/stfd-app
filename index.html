// KONFIGURATION — Module, Stufen, Pausen, Formatierung
// ============================================================
const MODULE_TOTAL_SESSIONS = {
  kurs: 12
};

// Module und Stufen: Das Beginner-Modul besteht aus 12 eigenständigen Workouts
// (kein Aufbauplan); jedes kann in beliebiger Reihenfolge trainiert werden.
// Die Stufen "leicht", "mittel" und "schwer" ändern Wiederholungen,
// Arbeitszeit und Pausen.
const MODULE_INTENSITY_KEYS = {
  kurs: ["leicht", "mittel", "schwer"]
};

// Index der Stufe in den Dreier-Listen der Einheiten.
const TIER_INDEX = {
  leicht: 0,
  mittel: 1,
  schwer: 2
};

// Zeit-Variante: Arbeits-/Pausenzeit (Sekunden) pro Station.
const TIME_RATIO = {
  leicht: {
    work: 30,
    rest: 30
  },
  mittel: {
    work: 40,
    rest: 20
  },
  schwer: {
    work: 45,
    rest: 15
  }
};
const UNIT_LABELS = {
  de: {
    reps: " Wdh.",
    reps_side: " pro Seite",
    sec: " Sek.",
    sec_side: " Sek. pro Seite",
    m: " m",
    m_side: " m pro Seite"
  },
  en: {
    reps: " reps",
    reps_side: " per side",
    sec: " sec",
    sec_side: " sec per side",
    m: " m",
    m_side: " m per side"
  }
};
const SIDE_WORDS = {
  de: {
    left: "links",
    right: "rechts"
  },
  en: {
    left: "left",
    right: "right"
  }
};

// Bei Seiten-Übungen beide Seiten explizit ausschreiben statt nur "pro Seite".
function formatReps(value, unit, lang) {
  if (unit.endsWith("_side")) {
    const baseUnit = UNIT_LABELS[lang][unit.replace("_side", "")];
    const w = SIDE_WORDS[lang];
    return `${value}${baseUnit} ${w.left} · ${value}${baseUnit} ${w.right}`;
  }
  return `${value}${UNIT_LABELS[lang][unit]}`;
}

// ============================================================
// TIMER-LOGIK
// ============================================================
function playBeep(long) {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.frequency.value = long ? 660 : 880;
    const dur = long ? 0.6 : 0.25;
    gain.gain.setValueAtTime(0.0001, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.3, ctx.currentTime + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + dur);
    osc.start();
    osc.stop(ctx.currentTime + dur);
  } catch (e) {
    // Web Audio nicht verfügbar — Timer läuft trotzdem stumm weiter
  }
}

// Eigenständiger Doppel-Chime (leiser, höherer Ton als playBeep), signalisiert
// z.B. beim Suitcase Carry die Hälfte der Arbeitszeit ("jetzt Seite wechseln"),
// ohne mit dem Übergangs-Beep von playBeep verwechselt zu werden.
function playHalfwayChime() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    [0, 0.16].forEach(offset => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.frequency.value = 520;
      const start = ctx.currentTime + offset;
      gain.gain.setValueAtTime(0.0001, start);
      gain.gain.exponentialRampToValueAtTime(0.22, start + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.13);
      osc.start(start);
      osc.stop(start + 0.14);
    });
  } catch (e) {
    // Web Audio nicht verfügbar — Hinweistext im UI bleibt trotzdem sichtbar
  }
}

// Übungen, bei denen zur Hälfte der Arbeitszeit die Seite gewechselt wird —
// bekommen im Zirkel/EMOM-Timer einen zusätzlichen Halbzeit-Chime, damit der
// Wechsel nicht mitten im Intervall Hektik erzeugt.
const HALFWAY_CHIME_EXERCISES = new Set(["Kettlebell Suitcase Carry"]);
function buildEmomSequence(exercises, rounds) {
  const seq = [];
  for (let r = 0; r < rounds; r++) exercises.forEach(ex => seq.push({
    label: ex.name,
    seconds: 60,
    type: "work"
  }));
  return seq;
}
function buildIntervalSequence(exercises, rounds, workSec, restSec, restLabel) {
  const seq = [];
  for (let r = 0; r < rounds; r++) {
    exercises.forEach((ex, i) => {
      seq.push({
        label: ex.name,
        seconds: workSec,
        type: "work",
        halfway: !!ex.switchSide
      });
      const isVeryLast = r === rounds - 1 && i === exercises.length - 1;
      if (!isVeryLast) seq.push({
        label: restLabel,
        seconds: restSec,
        type: "rest"
      });
    });
  }
  return seq;
}
// Liste aller Sätze einer Sätze-Einheit — ohne feste Zeit, die Pause wird jeweils
// manuell gestartet, sobald die Wiederholungen erledigt sind.
// Die Runde läuft außen: einmal durch ALLE Übungen (je ein Satz), erst danach
// beginnt die nächste Runde. Pausiert wird nur zwischen den Runden (siehe
// SetsTimer), nicht zwischen den Übungen innerhalb einer Runde.
function buildSetsSteps(exercises, sets) {
  const steps = [];
  for (let s = 1; s <= sets; s++) {
    exercises.forEach((ex, exIndex) => {
      steps.push({
        label: ex.name,
        reps: ex.reps,
        setNumber: s,
        totalSets: sets,
        exerciseIndex: exIndex + 1,
        totalExercises: exercises.length
      });
    });
  }
  return steps;
}

// Schritte für Supersatz-Blöcke: pro Block und Satz einmal durch alle Übungen des
// Blocks, die Pause kommt erst nach dem letzten Block-Eintrag.
function buildBlockSteps(blocks) {
  const total = blocks.reduce((n, b) => n + b.exercises.length, 0);
  const steps = [];
  let globalIndex = 0;
  blocks.forEach(b => {
    for (let setNo = 1; setNo <= b.sets; setNo++) {
      b.exercises.forEach((ex, i) => {
        steps.push({
          label: ex.name,
          reps: ex.reps,
          setNumber: setNo,
          totalSets: b.sets,
          exerciseIndex: i + 1,
          totalExercises: b.exercises.length,
          restAfter: i === b.exercises.length - 1 ? b.rest : 0,
          globalIndex: ++globalIndex % total || total,
          globalTotal: total
        });
      });
    }
  });
  return steps;
}

// Leiter: Swing bleibt gleich, die Liegestütze nehmen pro Runde um einen ab.
function buildLadderSteps(exercises, pushFrom, rest, lang) {
  const steps = [];
  const [swing, push] = exercises;
  for (let r = 1; r <= pushFrom; r++) {
    steps.push({
      label: swing.name,
      reps: swing.reps,
      setNumber: r,
      totalSets: pushFrom,
      exerciseIndex: 1,
      totalExercises: 2,
      restAfter: 0
    });
    steps.push({
      label: push.name,
      reps: formatReps(pushFrom - r + 1, "reps", lang),
      setNumber: r,
      totalSets: pushFrom,
      exerciseIndex: 2,
      totalExercises: 2,
      restAfter: r < pushFrom ? rest : 0
    });
  }
  return steps;
}

// Erlaubte Dauer-Optionen für eine einzelne Einheit, als Anzahl Sätze/Runden
// Bei 6 Übungen pro Einheit ergibt das 12 / 18 / 24 / 30 Minuten.
const DURATION_CHOICES = [2, 3, 4, 5];

// Wendet eine abweichende Dauer (Anzahl Sätze bzw. Runden) auf eine bereits
// berechnete sessionData an, ohne die zugrunde liegenden Stufen-Daten zu
// verändern. count === null bedeutet: die im Plan hinterlegte Standarddauer.
function buildSessionSteps(d, lang, withFinisher) {
  if (d.format === "ladder") return buildLadderSteps(d.exercises, d.pushFrom, d.restBetween, lang);
  const steps = buildSetsSteps(d.exercises, d.sets);
  if (withFinisher && d.finisher) {
    const f = buildBlockSteps([{
      sets: d.finisher.sets,
      rest: d.finisher.rest,
      exercises: d.finisher.exercises
    }]);
    f.forEach(st => {
      st.tag = "Finisher";
    });
    return steps.concat(f);
  }
  return steps;
}
// Formate, die über den Sätze-Timer laufen (Pause nach Satz statt fester Intervalle).
const isStepFormat = f => f === "sets" || f === "ladder";
function applyDurationChoice(sessionData, count, t) {
  if (!count) return sessionData;
  if (sessionData.format === "sets") {
    return {
      ...sessionData,
      sets: count
    };
  }
  if (sessionData.format === "circuit") {
    const totalMinutes = Math.round(count * sessionData.exercises.length * (sessionData.workSec + sessionData.restSec) / 60);
    return {
      ...sessionData,
      rounds: count,
      totalMinutes
    };
  }
  if (sessionData.format === "emom") {
    const totalMinutes = count * sessionData.exercises.length;
    return {
      ...sessionData,
      rounds: count,
      totalMinutes,
      restLabel: t.emomLabel(count, sessionData.exercises.length, totalMinutes)
    };
  }
  return sessionData;
}

// PROGRAMM-LOGIK — Einheit/Bibliothek aus den Trainingsplan-Daten ableiten
// ============================================================
function getSessionData(module, sessionNum, intensityKey, lang, mode = "reps") {
  const data = getBaseSessionData(module, sessionNum, intensityKey, lang, mode);
  const fin = SESSIONS_KURS[sessionNum].finisher;
  if (fin && (data.format === "sets" || data.format === "circuit")) {
    const pickIdx = TIER_INDEX[intensityKey] ?? 0;
    const sets = Array.isArray(fin.sets) ? fin.sets[pickIdx] : fin.sets;
    const exercises = fin.exercises.map((e, i) => {
      const value = e.t[pickIdx];
      return {
        name: e.n,
        key: slug(e.n),
        cue: CUES[e.n][lang],
        isSide: e.u.endsWith("_side"),
        unit: e.u,
        repsValue: value,
        reps: formatReps(value, e.u, lang),
        groupLabel: `Superset ${"AB"[i]}`
      };
    });
    data.finisher = {
      sets,
      rest: fin.rest,
      exercises,
      minutes: Math.round(sets * (exercises.length + fin.rest / 60))
    };
  }
  return data;
}
function getBaseSessionData(module, sessionNum, intensityKey, lang, mode = "reps") {
  const t = UI[lang];
  const tierKey = intensityKey;
  const idx = TIER_INDEX[tierKey] ?? 0;
  const pick = v => Array.isArray(v) ? v[idx] : v;
  const session = SESSIONS_KURS[sessionNum];
  const buildEx = e => {
    const value = e.t ? e.t[idx] : null;
    const isSide = e.u.endsWith("_side");
    const ex = {
      name: e.n,
      key: slug(e.n),
      cue: CUES[e.n][lang],
      sideNote: isSide ? t.sideNote : null,
      isSide,
      unit: e.u
    };
    if (value != null) {
      ex.repsValue = value;
      ex.reps = formatReps(value, e.u, lang);
    }
    return ex;
  };

  // Zeit-Variante für Sätze-Einheiten: dieselben Übungen als Zirkel mit fester
  // Arbeits-/Pausenzeit pro Station (nicht bei Chipper/Challenge).
  if (mode === "time" && session.format === "sets" && !session.fixed) {
    const ratio = TIME_RATIO[tierKey] || TIME_RATIO.leicht;
    const exercises = session.exercises.map(e => {
      const switchSide = e.u.endsWith("_side");
      return {
        name: e.n,
        key: slug(e.n),
        cue: CUES[e.n][lang],
        sideNote: switchSide ? t.sideSwitchNote : null,
        switchSide
      };
    });
    const rounds = pick(session.sets);
    const totalMinutes = Math.round(rounds * exercises.length * (ratio.work + ratio.rest) / 60);
    return {
      session,
      block: session.block,
      format: "circuit",
      rounds,
      workSec: ratio.work,
      restSec: ratio.rest,
      totalMinutes,
      exercises
    };
  }
  if (session.format === "sets") {
    const exercises = session.exercises.map(buildEx);
    const restBetween = session.rest;
    const sets = pick(session.sets);
    return {
      session,
      block: session.block,
      format: "sets",
      sets,
      restBetween,
      restLabel: t.restBetween(restBetween),
      exercises,
      fixed: !!session.fixed
    };
  }
  if (session.format === "ladder") {
    const swing = buildEx(session.swing);
    const push = {
      name: session.push.n,
      key: slug(session.push.n),
      cue: CUES[session.push.n][lang],
      sideNote: null,
      isSide: false,
      reps: `${session.pushFrom} → 1${UNIT_LABELS[lang].reps}`
    };
    const rest = pick(session.rest);
    const totalMinutes = Math.round(session.pushFrom * (1 + rest / 60));
    return {
      session,
      block: session.block,
      format: "ladder",
      pushFrom: session.pushFrom,
      sets: session.pushFrom,
      rounds: session.pushFrom,
      restBetween: rest,
      totalMinutes,
      exercises: [swing, push],
      fixed: true
    };
  }
  if (session.format === "circuit") {
    const exercises = session.exercises.map(e => {
      const switchSide = e.u.endsWith("_side");

  // history.back() auf, damit der History-Stack immer zum sichtbaren Zustand passt.

      kbLayer: "programList"

  }, [programView]);

      if (activeTimer) {

      if (libraryView === "detail") {

        if (libraryFromSession) {
          setLibraryFromSession(false);
          setTab("program");

        return;
      }
      if (programView === "detail") {
        setProgramView("list");
        return;
      }
      if (programView === "list") {

    return () => window.removeEventListener("popstate", handlePopState);
  }, [activeTimer, libraryView, libraryFromSession, programView]);

        };
        // Der frühere Einsteiger-Kurs (Probetraining) existiert nicht mehr, ebenso
        // der alte Beginner-Plan. Fortschritt im alten Beginner-Plan (ohne `v: 2`)
        // passt nicht zu den neuen Workouts und wird zurückgesetzt.
        const savedKurs = parsed.modules && parsed.modules.kurs && parsed.modules.kurs.v === 2 ? parsed.modules.kurs : emptyState().modules.kurs;
